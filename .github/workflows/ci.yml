name: CI Fullstack Activité 3

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  e2e-fullstack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer les secrets Docker
        run: |
          mkdir -p secrets
          printf '%s' '${{ secrets.MYSQL_ROOT_PASSWORD }}' > secrets/mysql_root_password.txt
          printf '%s' '${{ secrets.MYSQL_DB }}' > secrets/mysql_database.txt
          printf '%s' '${{ secrets.MYSQL_USER }}' > secrets/mysql_user.txt
          printf '%s' '${{ secrets.MYSQL_PASSWORD }}' > secrets/mysql_password.txt

      - name: Démarrer la stack complète
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: docker compose up -d --build

      - name: Vérifier l'état des containers
        run: |
          for i in {1..24}; do
            echo "Tentative $i"
            docker compose ps

            db_status=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q db))
            api_status=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q api))
            react_status=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q react))
            adminer_status=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose ps -q adminer))

            if [ "$db_status" = "healthy" ] && [ "$api_status" = "healthy" ] && [ "$react_status" = "healthy" ] && [ "$adminer_status" = "healthy" ]; then
              echo "Tous les services sont healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Un ou plusieurs services ne sont pas healthy."
          docker compose logs
          exit 1

      - name: Vérifier les endpoints réels
        run: |
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/users
          curl --fail http://localhost:3000

      - name: Installer Node.js pour Cypress
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances Cypress
        working-directory: e2e
        run: npm install

      - name: Exécuter les tests Cypress E2E
        working-directory: e2e
        run: npx cypress run --config baseUrl=http://localhost:3000

      - name: Logs Docker en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter la stack
        if: always()
        run: docker compose down -v

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: e2e-fullstack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Préparer les secrets Docker
        run: |
          mkdir -p secrets
          printf '%s' '${{ secrets.MYSQL_ROOT_PASSWORD }}' > secrets/mysql_root_password.txt
          printf '%s' '${{ secrets.MYSQL_DB }}' > secrets/mysql_database.txt
          printf '%s' '${{ secrets.MYSQL_USER }}' > secrets/mysql_user.txt
          printf '%s' '${{ secrets.MYSQL_PASSWORD }}' > secrets/mysql_password.txt

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push des images après succès E2E
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker compose build api react
          docker compose push api react
