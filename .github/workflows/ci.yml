name: CI API Python

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  integration-api:
    needs: npm-publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build MySQL image
        run: docker build -t my-mysql-test ./mysql

      - name: Build API image
        run: docker build -t my-fastapi-test ./api

      - name: Create Docker network
        run: docker network create app-network

      - name: Run MySQL container
        run: |
          docker run -d \
            --name mysql-container \
            --network app-network \
            -e MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }} \
            -e MYSQL_DATABASE=${{ secrets.MYSQL_DB }} \
            -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
            -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            my-mysql-test

      - name: Wait for MySQL init
        run: sleep 25

      - name: Run API container
        run: |
          docker run -d \
            --name api-container \
            --network app-network \
            -e MYSQL_HOST=mysql-container \
            -e MYSQL_USER=${{ secrets.MYSQL_USER }} \
            -e MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
            -e MYSQL_DB=${{ secrets.MYSQL_DB }} \
            -p 8000:8000 \
            my-fastapi-test

      - name: Wait for API startup
        run: sleep 10

      - name: Test /users endpoint
        run: |
          response=$(curl --silent --show-error --fail http://localhost:8000/users)
          echo "$response"
          echo "$response" | grep '"utilisateurs"' >/dev/null
          echo "$response" | grep -v '"utilisateurs":[[:space:]]*\[\]' >/dev/null

      - name: Tag API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag my-fastapi-test ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-activity:latest

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-activity:latest
